
<!DOCTYPE html>
<html lang="am">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>DAN SHOP ETH</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#f3f5f9;color:#14233a}
header{background:#07172e;color:white;padding:15px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.logo{font-size:24px;font-weight:bold;margin-right:auto}
.logo span{color:#ffbd35}
input,select{padding:12px;border:1px solid #ddd;border-radius:8px}
#search{flex:1;min-width:130px}
nav{background:white;padding:14px;display:flex;gap:22px;overflow:auto}
nav a{color:#14233a;text-decoration:none;font-weight:bold;white-space:nowrap}
main{max-width:1200px;margin:auto;padding:16px}
.hero{background:linear-gradient(120deg,#07172e,#0875e8);color:white;padding:30px;border-radius:14px;display:flex;align-items:center;justify-content:space-between}
.hero h1{font-size:35px}.hero span{color:#ffbd35}
button{padding:11px;border:0;border-radius:8px;cursor:pointer}
.hero button{background:#ffbd35;font-weight:bold}
.categories{display:flex;gap:8px;overflow:auto;margin:20px 0}
.categories button{background:white;white-space:nowrap}
.products{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.product{background:white;padding:11px;border-radius:12px;box-shadow:0 2px 8px #0001}
.product img{width:100%;height:150px;object-fit:contain;background:#f5f6f8;border-radius:8px}
.product h3{font-size:15px;min-height:35px}
.price{font-weight:bold;color:#0875e8;font-size:18px}
.add{background:#0875e8;color:white;width:100%}
.panel{background:white;padding:18px;border-radius:12px;margin-top:20px}
.field{width:100%;margin:7px 0}
.cartbtn{position:fixed;bottom:15px;right:15px;background:#0875e8;color:white;border-radius:25px;z-index:3}
.modal{display:none;position:fixed;inset:0;background:#0009;z-index:9;align-items:center;justify-content:center;padding:15px}
.modal.show{display:flex}
.dialog{background:white;padding:20px;border-radius:12px;width:100%;max-width:480px;max-height:90vh;overflow:auto}
footer{background:#07172e;color:white;padding:25px;margin-top:30px}
footer a{color:#ffbd35}
@media(max-width:850px){.products{grid-template-columns:repeat(3,1fr)}}
@media(max-width:550px){.products{grid-template-columns:repeat(2,1fr)}.hero h1{font-size:26px}.hero{padding:20px}.product img{height:115px}}
</style>
</head>
<body>
<header>
 <div class="logo">DAN <span>SHOP ETH</span></div>
 <input id="search" placeholder="እቃ ፈልግ..." oninput="render()">
 <select id="language" onchange="changeLanguage()">
  <option value="am">አማርኛ</option>
  <option value="en">English</option>
  <option value="om">Afaan Oromoo</option>
  <option value="so">Soomaali</option>
  <option value="ar">العربية</option>
  <option value="fr">Français</option>
  <option value="de">Deutsch</option>
 </select>
</header>
<nav>
 <a href="#">መነሻ</a><a href="#products">እቃዎች</a>
 <a href="#delivery">ማድረሻ</a><a href="#payment">ክፍያ</a>
 <a href="#contact">አግኙን</a>
</nav>
<main>
<section class="hero">
 <div>
  <h1>DAN <span>SHOP ETH</span></h1>
  <h3 id="welcome">የሚፈልጉትን ሁሉ በአንድ ቦታ!</h3>
  <p>ጥራት • ቀላል ግዢ • የቤት ማድረስ</p>
  <button onclick="document.getElementById('products').scrollIntoView()">አሁን ይግዙ</button>
 </div>
 <div style="font-size:70px">🛍️</div>
</section>

<div class="categories">
 <button onclick="filter('all')">ሁሉም</button>
 <button onclick="filter('Shoes')">👟 ጫማ</button>
 <button onclick="filter('Phones')">📱 ስልኮች</button>
 <button onclick="filter('Home')">🏠 የቤት እቃ</button>
 <button onclick="filter('Beauty')">🌸 ውበት</button>
 <button onclick="filter('Gaming')">🎮 ጌም</button>
 <button onclick="filter('Fashion')">👕 ልብስ</button>
</div>

<h2 id="products">🔥 የሱቅ እቃዎች</h2>
<div class="products" id="productList"></div>

<section class="panel" id="delivery">
<h2>📍 የደንበኛ አድራሻ</h2>
<input class="field" id="customerName" placeholder="ሙሉ ስም">
<input class="field" id="customerPhone" placeholder="ስልክ ቁጥር">
<input class="field" id="customerAddress" placeholder="ከተማና አካባቢ">
<button onclick="getLocation()">📍 Location ላክ</button>
<p id="locationText">አካባቢዎን ለማጋራት ይጫኑ።</p>
</section>

<section class="panel" id="payment">
<h2>💳 የክፍያ አማራጮች</h2>
<select id="paymentMethod" class="field">
<option>Cash on Delivery</option>
<option>Telebirr</option>
<option>CBE Birr</option>
<option>Bank Transfer</option>
<option>Binance Pay</option>
</select>
<p>የኦንላይን ክፍያ ለማገናኘት የክፍያ አቅራቢ መለያ ያስፈልጋል።</p>
</section>
</main>

<footer id="contact">
<h2>DAN SHOP ETH</h2>
<p>WhatsApp: 0988407460</p>
<a href="https://wa.me/251988407460">WhatsApp ይክፈቱ</a>
</footer>

<button class="cartbtn" onclick="openCart()">🛒 ቅርጫት (<span id="count">0</span>)</button>
<div class="modal" id="cartModal">
 <div class="dialog">
  <button onclick="closeCart()" style="float:right">✖</button>
  <h2>🛒 የግዢ ቅርጫት</h2>
  <div id="cartItems"></div>
  <h3 id="total"></h3>
  <button class="add" onclick="sendOrder()">ትዕዛዝ በWhatsApp ላክ</button>
 </div>
</div>

<script>
const products=[
{id:1,name:"Air Jordan 1",cat:"Shoes",price:18000,img:"https://images.unsplash.com/photo-1552346154-21d32810aba3?w=500"},
{id:2,name:"Nike Air Force 1",cat:"Shoes",price:15000,img:"https://images.unsplash.com/photo-1542291026-7eec264c27ff?w=500"},
{id:3,name:"Jordan High Top",cat:"Shoes",price:19500,img:"https://images.unsplash.com/photo-1460353581641-37baddab0fa2?w=500"},
{id:4,name:"Smartphone",cat:"Phones",price:28000,img:"https://images.unsplash.com/photo-1511707171634-5f897ff02aa9?w=500"},
{id:5,name:"Coffee Grinder",cat:"Home",price:6500,img:"https://images.unsplash.com/photo-1517668808822-9ebb02f2a0e6?w=500"},
{id:6,name:"Perfume",cat:"Beauty",price:7500,img:"https://images.unsplash.com/photo-1541643600914-78b084683601?w=500"},
{id:7,name:"PlayStation 5",cat:"Gaming",price:90000,img:"https://images.unsplash.com/photo-1606813907291-d86efa9b94db?w=500"},
{id:8,name:"Backpack",cat:"Fashion",price:4300,img:"https://images.unsplash.com/photo-1553062407-98eeb64c6a62?w=500"},
{id:9,name:"Khaki Trousers",cat:"Fashion",price:3500,img:"https://images.unsplash.com/photo-1473966968600-fa801b869a1a?w=500"},
{id:10,name:"Television",cat:"Home",price:65000,img:"https://images.unsplash.com/photo-1593359677879-a4bb92f829d1?w=500"},
{id:11,name:"Juicer",cat:"Home",price:7800,img:"https://images.unsplash.com/photo-1570222094114-d054a817e56b?w=500"},
{id:12,name:"Headphones",cat:"Phones",price:8500,img:"https://images.unsplash.com/photo-1505740420928-5e560c06d30e?w=500"}
];
let active="all",cart=[],locationLink="";
function render(){
 const q=document.getElementById("search").value.toLowerCase();
 const found=products.filter(p=>(active==="all"||p.cat===active)&&p.name.toLowerCase().includes(q));
 document.getElementById("productList").innerHTML=found.map(p=>`
 <article class="product">
 <img src="${p.img}" alt="${p.name}" loading="lazy" onerror="this.src='https://placehold.co/400x300?text=Product'">
 <h3>${p.name}</h3>
 <p class="price">${p.price.toLocaleString()} ETB</p>
 <button class="add" onclick="add(${p.id})">ወደ ቅርጫት ጨምር</button>
 </article>`).join("");
}
function filter(cat){active=cat;render()}
function add(id){cart.push(products.find(p=>p.id===id));document.getElementById("count").textContent=cart.length}
function openCart(){
 document.getElementById("cartModal").classList.add("show");
 document.getElementById("cartItems").innerHTML=cart.length?cart.map((p,i)=>`<p>${p.name} — ${p.price.toLocaleString()} ETB <button onclick="removeItem(${i})">✖</button></p>`).join(""):"ቅርጫቱ ባዶ ነው።";
 document.getElementById("total").textContent="ጠቅላላ: "+cart.reduce((s,p)=>s+p.price,0).toLocaleString()+" ETB";
}
function removeItem(i){cart.splice(i,1);document.getElementById("count").textContent=cart.length;openCart()}
function closeCart(){document.getElementById("cartModal").classList.remove("show")}
function getLocation(){
 if(!navigator.geolocation){alert("Location አይደገፍም");return}
 navigator.geolocation.getCurrentPosition(pos=>{
 locationLink="https://maps.google.com/?q="+pos.coords.latitude+","+pos.coords.longitude;
 document.getElementById("locationText").innerHTML='<a target="_blank" href="'+locationLink+'">Location ተይዟል — ካርታ ክፈት</a>';
 },()=>alert("Location ፈቃድ ስጥ።"));
}
function sendOrder(){
 if(!cart.length){alert("እቃ አልመረጥክም");return}
 const name=document.getElementById("customerName").value.trim();
 const phone=document.getElementById("customerPhone").value.trim();
 const address=document.getElementById("customerAddress").value.trim();
 if(!name||!phone||!address){alert("ስም፣ ስልክና አድራሻ ሙላ");return}
 const total=cart.reduce((s,p)=>s+p.price,0);
 const lines=cart.map(p=>p.name+" - "+p.price+" ETB").join("\n");
 const message="DAN SHOP ETH ORDER\nName: "+name+"\nPhone: "+phone+"\nAddress: "+address+"\nPayment: "+document.getElementById("paymentMethod").value+"\n"+lines+"\nTotal: "+total+" ETB\nLocation: "+locationLink;
 window.open("https://wa.me/251988407460?text="+encodeURIComponent(message),"_blank");
}
function changeLanguage(){
 const lang=document.getElementById("language").value;
 const messages={am:"አማርኛ ተመርጧል",en:"English selected",om:"Afaan Oromoo filatame",so:"Soomaali la doortay",ar:"تم اختيار العربية",fr:"Français sélectionné",de:"Deutsch ausgewählt"};
 alert(messages[lang]);
}
render();
</script>
</body>
</html>
